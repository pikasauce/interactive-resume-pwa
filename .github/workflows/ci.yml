name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run lint checks
        run: npm run lint

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Package validation
        run: bash scripts/release/release.sh ci-${{ github.run_number }}

      # Deploys only fire on main after lint + e2e have already passed above,
      # and only once the Render Deploy Hook secrets exist (see docs/runbook.md) —
      # until then these steps are skipped rather than failing the build.
      - name: Deploy resume-api to Render
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.RENDER_DEPLOY_HOOK_RESUME_API != ''
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_RESUME_API }}"

      - name: Deploy resume-ui to Render
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.RENDER_DEPLOY_HOOK_RESUME_UI != ''
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_RESUME_UI }}"
